<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Registry</title>
<!-- Default favicon (puzzle piece); overridden by the "favicon" field of registry.json,
     which accepts either an emoji or an image URL. -->
<link id="favicon" rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #59636e;
    --border: #d1d9e0; --accent: #0969da; --badge-bg: #ddf4ff; --badge-fg: #0969da;
    --mono-bg: #f0f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #9198a1;
      --border: #30363d; --accent: #4493f8; --badge-bg: #121d2f; --badge-fg: #4493f8;
      --mono-bg: #0d1117;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; }
  .sub a { color: var(--accent); text-decoration: none; }
  .sub a:hover { text-decoration: underline; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 1.1rem 1.3rem; margin-bottom: 1rem;
    display: grid; grid-template-columns: 48px 1fr; gap: .35rem 1rem;
  }
  .card .icon {
    grid-row: 1 / span 2; width: 48px; height: 48px; border-radius: 10px;
    background: var(--mono-bg); align-self: start; margin-top: .15rem;
  }
  .card .body { grid-column: 2; }
  .card h2 { margin: 0; font-size: 1.15rem; display: inline; }
  .badge {
    display: inline-block; background: var(--badge-bg); color: var(--badge-fg);
    border-radius: 999px; padding: .05rem .6rem; font-size: .8rem; font-weight: 600;
    margin-left: .5rem; vertical-align: 2px;
  }
  .badge.cat { background: var(--mono-bg); color: var(--muted); border: 1px solid var(--border); }
  .desc { margin: .5rem 0 .75rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem 1rem; margin: 0; font-size: .87rem; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .85em;
    background: var(--mono-bg); border: 1px solid var(--border); border-radius: 4px; padding: .05rem .3rem;
  }
  a.dl { color: var(--accent); text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  .registry-url {
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: .7rem .9rem; margin: 0 0 1rem; font-size: .87rem;
  }
  .registry-url .label { color: var(--muted); }
  .registry-url code { overflow-wrap: anywhere; }
  #copy-btn {
    margin-left: auto; padding: .3rem .8rem; font: inherit; font-size: .82rem;
    color: var(--text); background: var(--mono-bg); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer;
  }
  #copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  #copy-btn.copied { color: #1a7f37; border-color: #1a7f37; }
  #search {
    width: 100%; margin: 0 0 1.5rem; padding: .55rem .9rem; font: inherit;
    color: var(--text); background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }
  #status { color: var(--muted); }
  .error { color: #d1242f; }
</style>
</head>
<body>
<main>
  <h1 id="title">Plugin Registry</h1>
  <p class="sub">Plugins published by this registry &middot;
    <a href="https://github.com/NewhostGH/openbrigade-plugin-registry-example">source repository</a></p>
  <div class="registry-url">
    <span class="label">Registry URL:</span>
    <code id="reg-url"></code>
    <button id="copy-btn" type="button" title="Copy registry URL">Copy</button>
  </div>
  <input id="search" type="search" placeholder="Search plugins by name, category or description&hellip;"
         autocomplete="off" hidden>
  <div id="status">Loading catalog&hellip;</div>
  <div id="plugins"></div>
</main>
<script>
  const regUrl = new URL('registry.json', location.href).href;
  document.getElementById('reg-url').textContent = regUrl;

  const copyBtn = document.getElementById('copy-btn');
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(regUrl);
    } catch {
      const range = document.createRange();
      range.selectNodeContents(document.getElementById('reg-url'));
      getSelection().removeAllRanges();
      getSelection().addRange(range);
      document.execCommand('copy');
      getSelection().removeAllRanges();
    }
    copyBtn.textContent = 'Copied!';
    copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 1500);
  });

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // registry.json "favicon": an image URL, or an emoji rendered into an SVG favicon.
  function applyFavicon(favicon) {
    if (typeof favicon !== 'string' || !favicon.trim()) return;
    const link = document.getElementById('favicon');
    link.href = /^https?:\/\//.test(favicon)
      ? favicon
      : "data:image/svg+xml," + encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${favicon.trim()}</text></svg>`);
  }

  fetch('registry.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(reg => {
      const name = reg.name || 'Plugin Registry';
      document.getElementById('title').textContent = name;
      document.title = name;
      applyFavicon(reg.favicon);

      const plugins = Array.isArray(reg.plugins) ? reg.plugins : [];
      document.getElementById('status').hidden = true;
      document.getElementById('plugins').innerHTML = plugins.map(p => `
        <div class="card" data-search="${esc([p.name, p.slug, p.category, p.author, p.description].filter(Boolean).join(' ').toLowerCase())}">
          ${p.icon ? `<img class="icon" src="${esc(p.icon)}" alt="" loading="lazy">` : '<span class="icon"></span>'}
          <div class="body">
            <h2>${esc(p.name)}</h2><span class="badge">v${esc(p.version)}</span>${p.category ? `<span class="badge cat">${esc(p.category)}</span>` : ''}
            <p class="desc">${esc(p.description)}</p>
            <dl>
              <dt>Slug</dt><dd><code>${esc(p.slug)}</code></dd>
              <dt>Min app version</dt><dd>${esc(p.min_app_version)}</dd>
              ${p.author ? `<dt>Author</dt><dd>${esc(p.author)}</dd>` : ''}
              <dt>Package</dt><dd><a class="dl" href="${esc(p.download_url)}">${esc(p.download_url.split('/').pop())}</a></dd>
              <dt>SHA-256</dt><dd><code>${esc(p.sha256)}</code></dd>
            </dl>
          </div>
        </div>`).join('');

      const search = document.getElementById('search');
      const cards = [...document.querySelectorAll('#plugins .card')];
      search.hidden = false;
      search.addEventListener('input', () => {
        const terms = search.value.toLowerCase().split(/\s+/).filter(Boolean);
        for (const card of cards) {
          const hay = card.dataset.search;
          card.style.display = terms.every(t => hay.includes(t)) ? '' : 'none';
        }
      });
    })
    .catch(e => {
      const s = document.getElementById('status');
      s.className = 'error';
      s.hidden = false;
      s.textContent = 'Failed to load registry.json: ' + e.message;
    });
</script>
</body>
</html>
